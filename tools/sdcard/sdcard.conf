# /etc/sdcard.conf - settings for the WSL SD card auto-mount (shell syntax).
# Installed by tools/sdcard/install.sh; edit in place, then: sudo systemctl restart sdcard-usbip-attach

# USB vendor:product of the SD card reader(s) as shown by `usbipd list` on Windows.
# List every reader you use, space separated; whichever one is plugged in and
# shared gets attached. Each one needs a one-time `usbipd bind` on Windows.
USB_HARDWARE_ID="05e3:0749 05e3:0764"

# Where the card is mounted inside WSL. The planner writes to $MOUNT_POINT/routes.
#
# This must live under /mnt/wsl. WSL2 runs login shells in a different mount
# namespace from PID 1, and / is private in both, so a mount made by a systemd
# unit anywhere else is invisible to your shell and to the planner. /mnt/wsl is
# the tmpfs WSL tags "shared:1" in every namespace, so mounts underneath it
# propagate. install.sh keeps /mnt/sdcard as a symlink here for compatibility.
MOUNT_POINT="/mnt/wsl/sdcard"

# Compatibility symlink pointing at MOUNT_POINT; everything else (config.yaml,
# import_logs.py) still refers to this path. Empty disables it.
COMPAT_LINK="/mnt/sdcard"

# Linux user that owns the mounted files (the user who runs the planner).
MOUNT_USER="tihor"

# IP of the Windows host running usbipd. "auto" tries the default gateway
# (NAT networking) and then 127.0.0.1 (mirrored networking).
HOST_IP="auto"

# How often (seconds) the auto-attach loop checks whether the reader needs attaching.
POLL_SECONDS=3

# The reader re-plugs itself when a card goes in or out, which drops the usbip
# link. Wait this long (seconds) before re-attaching so Windows has finished
# re-initialising it; a re-attach that comes too early hangs the disk probe.
REATTACH_GRACE=6

# If an attached reader's disk never shows up within this many seconds, detach
# and re-attach (the half-alive-link case).
STORAGE_TIMEOUT=20

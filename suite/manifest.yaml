  slip_turn_steady:
    scenario: 12 in run-up, 90 deg left at a constant 26 in/s (R18, 12 in curvature
      ramps), 5 in run-out
    exercises: rotation at constant speed
    watch: x/y drift at the end hold
    slip_test: true
    rotation_share:
      braking: 0.0
      accelerating: 0.0
      steady: 1.0
      moving_deg: 90.0
      in_place_deg: 0.0
    holds:
    - t:

generated_by: tools/make_suite.py
start_pose_robot_frame: (0.069, -23.664, pi) for every route except cruise_8ft, which
  starts at (48, -24, pi), and the slip_* routes, whose start is the pose of their
  first hold
log_naming: import the robot log and copy it to OverrideAutonomous/tests/logs/suite_<route>-<n>.txt
routes:
  hop_30in:
    scenario: 'the typical 2.6 ft segment: a triangle profile that never reaches cruise'
    exercises: accel/brake feedforward, stop accuracy at a low peak speed
    watch: final position error, creep at stop
    straight_in: 30
  cruise_8ft:
    scenario: 8 ft (4 tile) straight at max_velocity, x=+48 to x=-48
    exercises: top-end velocity tracking, usable-speed headroom
    watch: saturation fraction, straight wheel gain
    straight_in: 96
  arc_R6:
    scenario: 90 deg arc of 6 in radius from rest
    exercises: steady yaw at this radius band, effective track width, inner-wheel
      hold
    watch: heading p95, commanded rotation delivered
    radius_ft: 0.5
    arc_deg: 90
  arc_R12:
    scenario: 90 deg arc of 12 in radius from rest
    exercises: steady yaw at this radius band, effective track width, inner-wheel
      hold
    watch: heading p95, commanded rotation delivered
    radius_ft: 1.0
    arc_deg: 90
  arc_R24:
    scenario: 90 deg arc of 24 in radius from rest
    exercises: steady yaw at this radius band, effective track width, inner-wheel
      hold
    watch: heading p95, commanded rotation delivered
    radius_ft: 2.0
    arc_deg: 90
  corner_R6:
    scenario: 24 in straight, 6 in radius 90 deg corner, 24 in straight
    exercises: 'corner entered at speed: ramp-in lag, outer-wheel saturation, RAMSETE
      catch-up'
    watch: saturation run length, peak heading lag, cross-track on exit
    radius_ft: 0.5
    arc_deg: 90
  corner_R12:
    scenario: 24 in straight, 12 in radius 90 deg corner, 24 in straight
    exercises: 'corner entered at speed: ramp-in lag, outer-wheel saturation, RAMSETE
      catch-up'
    watch: saturation run length, peak heading lag, cross-track on exit
    radius_ft: 1.0
    arc_deg: 90
  chicane_R12:
    scenario: S-bend to a 17.6 in lateral offset over 36 in, inflection at 45 deg
    exercises: 'curvature sign flip at the inflection: yaw acceleration, angular feedforward
      sign'
    watch: yaw-accel tracking, cross-track not one-sided
    radius_ft: 1.0
    inflection_deg: 45
    holds_radius: false
  vee_reverse:
    scenario: 36 in forward, reverse cusp, 36 in backwards along a leg 60 deg off
      the first
    exercises: 'the most common real event: stop at the cusp, heading through the
      reversal, backward RAMSETE'
    watch: pose error at the cusp, unintended reverse test, final error
    straight_in: 36
  reverse_arc_R12:
    scenario: the 12 in arc driven in reverse from rest
    exercises: negative v through RAMSETE and the drive controller, kS sign, observer
      in reverse
    watch: heading p95 versus arc_R12, velocity tracking
    radius_ft: 1.0
    arc_deg: 90
  crawl_R3:
    scenario: 180 deg arc of 3 in radius at 4 in/s (per-node max_velocity)
    exercises: stiction and encoder quantisation at the speeds the real cusps are
      taken
    watch: low-speed velocity tracking, creep
    radius_ft: 0.25
    arc_deg: 180
    max_velocity_in_s: 4
  lift_while_driving:
    scenario: hop_30in with intake on and a lift score fired halfway
    exercises: lift and intake load during a move, intake inhibit while the lift is
      busy
    watch: tracking delta versus hop_30in
    straight_in: 30
  wall_reset:
    scenario: 52 in toward the left wall, front distance reset at the cusp, 52 in
      back
    exercises: DistanceResetOdometry correction size and whether it helps the return
      leg
    watch: reset correction magnitude, pose-jump test, final error
    straight_in: 52
  chain_4seg:
    scenario: 'four 30 in hops joined by reverse cusps: a miniature match auton'
    exercises: error accumulation across segments, cusp handling back to back
    watch: final error growth per segment
    straight_in: 30
    segments: 4
  slip_straight:
    scenario: 26 in straight toward the -x wall, full acceleration and braking, no
      turn
    exercises: 'along-track wheel slip on its own: the control for the turn tests'
    watch: x drift (front) vs the 26 in odometry says; y drift (left) should stay
      ~0
    straight_in: 26
    slip_test: true
    rotation_share:
      braking: 0.0
      accelerating: 0.0
      steady: 0.0
      moving_deg: 0.0
      in_place_deg: 0.0
    holds:
    - t:
      - 0.0
      - 0.59
      pose:
      - -20.0
      - -36.0
      - -180.0
      views:
        front: -x wall, 45.5 in, beam hits (-70.2, -30.3)
        left: -y wall, 28.8 in, beam hits (-22.8, -70.2)
    - t:
      - 1.57
      - 2.36
      pose:
      - -46.0
      - -36.0
      - 180.0
      views:
        front: -x wall, 19.5 in, beam hits (-70.2, -30.2)
        left: -y wall, 28.8 in, beam hits (-48.7, -70.2)
  slip_spin:
    scenario: five 90 deg in-place turns, alternating left/right, 4 in hops, a hold
      after each
    exercises: 'displacement from turning with no speed change: is the pivot where
      odometry assumes?'
    watch: x/y drift per spin, split by spin direction
    slip_test: true
